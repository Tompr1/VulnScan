name: Backend tests

# Runs on pull requests, and is called by deploy.yml on every push
# (so the tests gate each deployment).
on:
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest tests/unit
      - name: Integration tests (SQLite + HTTP stack)
        run: pytest tests/integration --cov=app.risk --cov=app.scanner --cov=app.scan_jobs --cov=app.api.schemas --cov-report=term-missing
