#!/usr/sbin/nft -f
# v0cday probe appliance: nothing comes in. The probe only connects out
# (platform on 443, scan targets); answers to those connections are let in.
# There is no SSH: use the hypervisor's console.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		# DHCP answers, IPv6 neighbour discovery and path MTU.
		udp sport 67 udp dport 68 accept
		meta l4proto ipv6-icmp accept
		icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
	}
	chain forward {
		# The probe uses the host's network; Docker manages its own tables.
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
